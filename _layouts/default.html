<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title -->
    <title>{% if page.page_title %}{{ page.page_title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

    <!-- SEO Meta -->
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="author" content="{{ site.author }}">
    <meta name="theme-color" content="#2F7597">

    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.page_title %}{{ page.page_title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/images/logo.png">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts (moved from CSS @import for performance) -->
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS and icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link href="/assets/css/styles.css" rel="stylesheet">
  </head>

  <body class="d-flex flex-column min-vh-100">

    <!-- Dark mode script (runs before paint to prevent flash) -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme-preference');
        if (!theme) theme = 'light'; // Default to light mode
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>

    {% include navigation.html %}

    <main class="flex-grow-1">
      {{ content }}
    </main>

    <!-- Footer -->
    <footer class="site-footer text-center mt-auto">
      <div class="container">
        <span>Copyright <i class="bi bi-c-square"></i> <span id="copyright-year"></span> <a href="https://github.com/Uthayamurthy" target="_blank">R Uthaya Murthy</a> &middot; All Rights Reserved</span>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Site JS -->
    <script src="/assets/js/main.js"></script>

  </body>
</html>
