<!-- navbar -->
<nav class="navbar navbar-expand-md sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/index.html" style="font-size: 1.25rem;">Uthay</a>
      <div class="d-flex align-items-center gap-2 order-md-2">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <i class="bi bi-moon-fill"></i>
        </button>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar" aria-controls="mynavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse order-md-1" id="mynavbar">
        <div class="navbar-nav mx-auto gap-1">
            {% for item in site.data.navigation %}
                {% if page.current == item.name %}
                    <a class="nav-link active" aria-current="page" href="{{ item.link }}">{{ item.name }}</a>
                {% else %}
                    <a class="nav-link" href="{{ item.link }}">{{ item.name }}</a>
                {% endif %}
            {% endfor %}
        </div>
      </div>
    </div>
</nav>
<!-- navbar ends -->
